name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify
        required: true
        default: v0.3.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'TunahanTuna/synorch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@c8e77b72cd6022852162c92aa10e7e72b7209c9b # v2
        with:
          runtime: node@24
          require-lockfile: true
          cache: false

      - name: Verify release tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_TAG}" != "v${package_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version v${package_version}."
            exit 1
          fi

      - name: Verify npm trusted publishing support
        shell: bash
        run: |
          npm_version="$(npx --yes npm@11.19.1 --version)"
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)" "${npm_version}"

      - name: Verify release
        run: pnpm check

      - name: Check whether this version is already published
        id: registry
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if npm view "synorch@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish package
        if: steps.registry.outputs.published != 'true'
        run: npx --yes npm@11.19.1 publish --access public
